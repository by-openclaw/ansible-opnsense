repos:
  # Secret detection — blocks commits containing passwords, API tokens, private keys
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            \.secrets\.baseline|
            tests/integration/.*\.sh|
            \.env\.example
          )$

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json

  # Deliberately NO linter hook here. This is an Ansible collection, not a
  # Python library: modules place DOCUMENTATION/EXAMPLES/RETURN before imports,
  # which ruff flags as E402 on correct code. ansible-lint is the right linter
  # but it writes files as it runs and fights pre-commit's stash, and CI already
  # runs it on every push. This config exists for the secret guard.
