---
# OPNsense connection defaults — override per host in host_vars/
# Credentials: use Ansible Vault or env vars, NEVER plain text.
#
# Example with vault:
#   ansible-playbook -i inventories/opnsense --ask-vault-pass playbooks/...
#
# Example with env vars:
#   OPN_KEY=... OPN_SECRET=... ansible-playbook ...

opn_host: "{{ ansible_host }}"
opn_port: 443
opn_verify_ssl: false

# These should be overridden via vault or extra-vars — NEVER commit real values
# opn_key: "{{ vault_opn_key }}"
# opn_secret: "{{ vault_opn_secret }}"
