name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Sanity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          GIT_AUTH: "x-access-token:${{ secrets.RUNE_GITHUB_TOKEN }}"
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint
          pip install "git+https://${GIT_AUTH}@github.com/by-openclaw/lib-opnsense.git"

      - name: Lint with ansible-lint
        run: ansible-lint plugins/

      - name: Ansible sanity check — validate module docs
        run: |
          python -c "
          import importlib, sys
          for mod in ['plugins.modules.opnsense_auth_user', 'plugins.modules.opnsense_auth_group']:
              m = importlib.import_module(mod)
              for attr in ['DOCUMENTATION', 'EXAMPLES', 'RETURN']:
                  if not getattr(m, attr, None):
                      print(f'FAIL: {mod} missing {attr}')
                      sys.exit(1)
          print('All module docstrings present.')
          "

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Bandit — Python SAST
        run: bandit -r plugins/ -ll -ii
