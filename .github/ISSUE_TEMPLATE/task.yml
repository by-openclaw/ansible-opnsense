name: Task
description: Approved work item from sprint plan
labels: ["task"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - feat — new feature
        - fix — bug fix
        - docs — documentation
        - chore — maintenance / refactor
        - security — hardening
        - test — test only
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Which OPNsense domain does this task belong to?
      options:
        - auth — users, groups, privileges, API keys
        - firewall — aliases, filter, NAT, categories, groups
        - interfaces — VLANs, VIPs, assignments
        - wireguard — WG instances and peers
        - dns — Unbound forwarders, host overrides, ACLs
        - dhcp — Kea subnets and reservations
        - routing — gateways, static routes
        - ipsec — IPsec connections, PSKs
        - monitoring — Monit alerts, IDS policies
        - shaper — traffic shaper pipes
        - xml — config.xml transport (lib-opnsense-xml)
        - infra — CI, devcontainer, registry, packaging
        - orchestration — provisioning pipeline, playbooks, roles
    validations:
      required: true

  - type: input
    id: sprint-ref
    attributes:
      label: Sprint reference
      description: Which sprint does this belong to?
      placeholder: "sprint-0, sprint-1, etc."
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - critical — blocks deployment
        - high — needed this sprint
        - medium — needed this phase
        - low — backlog
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope of work
      description: |
        What exactly needs to be done? Include:
        - Module name and lib-opnsense manager it wraps
        - Role name and tasks
        - E2E playbook name
        - Expected files (full paths)
      placeholder: |
        Module: opnsense_if_vlan (wraps IfVlanManager)
        Role: roles/interfaces/tasks/main.yml
        E2E: playbooks/playbook_interfaces_e2e.yml
        Files:
          - plugins/modules/opnsense_if_vlan.py
          - roles/interfaces/tasks/main.yml
          - roles/interfaces/defaults/main.yml
          - playbooks/playbook_interfaces_e2e.yml
          - docs/modules.md (update)
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety boundaries
      description: |
        What is safe to test on the live device?
      placeholder: |
        READ-ONLY: existing VLANs 310/320/330 (critical for network)
        CRUD safe: VIPs with inttest- prefix
        DISABLED only: NAT rules (apply crashes FW)
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of Done
      description: |
        How do we know this is complete? Testable criteria.
      placeholder: |
        - [ ] Ansible module with DOCUMENTATION, EXAMPLES, RETURN
        - [ ] Module uses opn_argument_spec + run_module pattern
        - [ ] Module supports check_mode
        - [ ] Role with defaults/main.yml (no hardcoded values)
        - [ ] E2E playbook: create, noop, error handling, cleanup
        - [ ] E2E tested against live device
        - [ ] docs/modules.md updated
        - [ ] ansible-lint clean
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files affected (full paths)
      description: List every file this task will create or modify.
      placeholder: |
        - plugins/modules/opnsense_if_vlan.py (new)
        - roles/interfaces/tasks/main.yml (new)
        - roles/interfaces/defaults/main.yml (new)
        - playbooks/playbook_interfaces_e2e.yml (new)
        - docs/modules.md (update)
    validations:
      required: true
