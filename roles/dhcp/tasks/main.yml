---
# Role: dhcp — manage OPNsense Kea DHCP subnets, reservations, and peers.
#
# Variables (from defaults/main.yml):
#   opn_kea4_subnets:       list of Kea DHCPv4 subnet dicts
#   opn_kea4_reservations:  list of Kea DHCPv4 reservation dicts
#   opn_kea4_peers:         list of Kea DHCPv4 HA peer dicts
#   opn_kea6_subnets:       list of Kea DHCPv6 subnet dicts
#   opn_kea6_reservations:  list of Kea DHCPv6 reservation dicts
#
# Order: kea4_subnets -> kea4_reservations -> kea4_peers -> kea6_subnets -> kea6_reservations.
# Subnets first (reservations reference subnets).

- name: "Ensure Kea4 subnet {{ item.subnet | default('unknown') }}"
  by_systems.opnsense.opnsense_kea4_subnet:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    subnet: "{{ item.subnet }}"
    pools: "{{ item.pools | default('') }}"
    next_server: "{{ item.next_server | default('') }}"
    description: "{{ item.description | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_kea4_subnets }}"
  loop_control:
    label: "{{ item.subnet | default('unknown') }}"
  when: opn_kea4_subnets | length > 0

- name: "Ensure Kea4 reservation {{ item.ip_address | default('unknown') }}"
  by_systems.opnsense.opnsense_kea4_reservation:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    ip_address: "{{ item.ip_address }}"
    hw_address: "{{ item.hw_address }}"
    hostname: "{{ item.hostname | default('') }}"
    description: "{{ item.description | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_kea4_reservations }}"
  loop_control:
    label: "{{ item.ip_address | default('unknown') }}"
  when: opn_kea4_reservations | length > 0

- name: "Ensure Kea4 HA peer {{ item.name | default('unknown') }}"
  by_systems.opnsense.opnsense_kea4_peer:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    name: "{{ item.name }}"
    role: "{{ item.role | default('primary') }}"
    url: "{{ item.url }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_kea4_peers }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"
  when: opn_kea4_peers | length > 0

- name: "Ensure Kea6 subnet {{ item.subnet | default('unknown') }}"
  by_systems.opnsense.opnsense_kea6_subnet:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    subnet: "{{ item.subnet }}"
    interface: "{{ item.interface }}"
    description: "{{ item.description | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_kea6_subnets }}"
  loop_control:
    label: "{{ item.subnet | default('unknown') }}"
  when: opn_kea6_subnets | length > 0

- name: "Ensure Kea6 reservation {{ item.ip_address | default('unknown') }}"
  by_systems.opnsense.opnsense_kea6_reservation:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    ip_address: "{{ item.ip_address }}"
    duid: "{{ item.duid }}"
    hostname: "{{ item.hostname | default('') }}"
    description: "{{ item.description | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_kea6_reservations }}"
  loop_control:
    label: "{{ item.ip_address | default('unknown') }}"
  when: opn_kea6_reservations | length > 0
