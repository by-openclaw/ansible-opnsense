---
# Role defaults — override in playbook vars, group_vars, or host_vars.

# Connection — ALL must be provided via inventory, group_vars, or extra-vars.
# No hardcoded defaults for host, port, key, secret, or verify_ssl.
# opn_host:
# opn_port:
# opn_key:
# opn_secret:
# opn_verify_ssl:

# Kea DHCPv4 subnets to ensure (list of dicts)
# Example:
#   opn_kea4_subnets:
#     - subnet: "10.0.0.0/24"
#       pools: "10.0.0.100-10.0.0.200"
#       description: "LAN DHCP pool"
#       state: present
opn_kea4_subnets: []

# Kea DHCPv4 reservations to ensure (list of dicts)
# Example:
#   opn_kea4_reservations:
#     - ip_address: "10.0.0.50"
#       hw_address: "00:11:22:33:44:55"
#       hostname: "printer-01"
#       state: present
opn_kea4_reservations: []

# Kea DHCPv4 HA peers to ensure (list of dicts)
# Example:
#   opn_kea4_peers:
#     - name: "fw-secondary"
#       role: standby
#       url: "http://10.0.0.2:8000/"
#       state: present
opn_kea4_peers: []

# Kea DHCPv6 subnets to ensure (list of dicts)
# Example:
#   opn_kea6_subnets:
#     - subnet: "fd00::/64"
#       interface: lan
#       description: "LAN DHCPv6"
#       state: present
opn_kea6_subnets: []

# Kea DHCPv6 reservations to ensure (list of dicts)
# Example:
#   opn_kea6_reservations:
#     - ip_address: "fd00::50"
#       duid: "00:03:00:01:00:11:22:33:44:55"
#       hostname: "printer-01"
#       state: present
opn_kea6_reservations: []
