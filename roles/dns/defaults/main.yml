---
# Role defaults — override in playbook vars, group_vars, or host_vars.

# Connection — ALL must be provided via inventory, group_vars, or extra-vars.
# No hardcoded defaults for host, port, key, secret, or verify_ssl.
# opn_host:
# opn_port:
# opn_key:
# opn_secret:
# opn_verify_ssl:

# Unbound host overrides to ensure (list of dicts)
# Example:
#   opn_host_overrides:
#     - hostname: "web-01"
#       domain: "example.com"
#       server: "10.0.0.10"
#       rr: A
#       state: present
opn_host_overrides: []

# Unbound host aliases to ensure (list of dicts)
# Example:
#   opn_host_aliases:
#     - hostname: "www"
#       domain: "example.com"
#       host_uuid: "<uuid-of-parent-override>"
#       state: present
opn_host_aliases: []

# DNS forwards to ensure (list of dicts)
# Example:
#   opn_forwards:
#     - domain: "corp.example.com"
#       server: "10.0.0.53"
#       type: forward
#       state: present
opn_forwards: []

# Unbound ACLs to ensure (list of dicts)
# Example:
#   opn_acls:
#     - name: "allow-internal"
#       action: allow
#       networks: "10.0.0.0/8"
#       state: present
opn_acls: []

# DNS-over-TLS servers to ensure (list of dicts)
# Example:
#   opn_dots:
#     - server: "1.1.1.1"
#       dot_port: "853"
#       verify: "cloudflare-dns.com"
#       state: present
opn_dots: []
