---
# Role: dns — manage OPNsense Unbound DNS overrides, forwards, ACLs, DoT.
#
# Variables (from defaults/main.yml):
#   opn_host_overrides: list of host override dicts
#   opn_host_aliases:   list of host alias dicts
#   opn_forwards:       list of DNS forward dicts
#   opn_acls:           list of Unbound ACL dicts
#   opn_dots:           list of DNS-over-TLS dicts
#
# Order: host_overrides -> host_aliases -> forwards -> ACLs -> DoT.
# Host overrides first (aliases reference override UUIDs).

- name: "Ensure host override {{ item.hostname | default('unknown') }}"
  by_systems.opnsense.opnsense_ub_host_override:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    hostname: "{{ item.hostname }}"
    domain: "{{ item.domain | default('') }}"
    server: "{{ item.server | default('') }}"
    rr: "{{ item.rr | default('A') }}"
    mxprio: "{{ item.mxprio | default('') }}"
    mx: "{{ item.mx | default('') }}"
    ttl: "{{ item.ttl | default('') }}"
    txtdata: "{{ item.txtdata | default('') }}"
    enabled: "{{ item.enabled | default(true) }}"
    description: "{{ item.description | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_host_overrides }}"
  loop_control:
    label: "{{ item.hostname | default('unknown') }}"
  when: opn_host_overrides | length > 0

- name: "Ensure host alias {{ item.hostname | default('unknown') }}"
  by_systems.opnsense.opnsense_ub_host_alias:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    hostname: "{{ item.hostname }}"
    domain: "{{ item.domain | default('') }}"
    host_uuid: "{{ item.host_uuid | default('') }}"
    enabled: "{{ item.enabled | default(true) }}"
    description: "{{ item.description | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_host_aliases }}"
  loop_control:
    label: "{{ item.hostname | default('unknown') }}"
  when: opn_host_aliases | length > 0

- name: "Ensure DNS forward {{ item.domain | default('unknown') }}"
  by_systems.opnsense.opnsense_ub_forward:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    domain: "{{ item.domain }}"
    server: "{{ item.server | default('') }}"
    type: "{{ item.type | default('forward') }}"
    forward_port: "{{ item.forward_port | default('') }}"
    enabled: "{{ item.enabled | default(true) }}"
    description: "{{ item.description | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_forwards }}"
  loop_control:
    label: "{{ item.domain | default('unknown') }}"
  when: opn_forwards | length > 0

- name: "Ensure Unbound ACL {{ item.name | default('unknown') }}"
  by_systems.opnsense.opnsense_ub_acl:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    name: "{{ item.name }}"
    action: "{{ item.action | default('allow') }}"
    networks: "{{ item.networks | default('') }}"
    enabled: "{{ item.enabled | default(true) }}"
    description: "{{ item.description | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_acls }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"
  when: opn_acls | length > 0

- name: "Ensure DoT server {{ item.server | default('unknown') }}"
  by_systems.opnsense.opnsense_ub_dot:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    server: "{{ item.server }}"
    dot_port: "{{ item.dot_port | default('853') }}"
    type: "{{ item.type | default('dot') }}"
    verify: "{{ item.verify | default('') }}"
    domain: "{{ item.domain | default('') }}"
    enabled: "{{ item.enabled | default(true) }}"
    description: "{{ item.description | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_dots }}"
  loop_control:
    label: "{{ item.server | default('unknown') }}"
  when: opn_dots | length > 0
