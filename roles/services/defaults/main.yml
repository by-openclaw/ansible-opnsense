---
# Role defaults — override in playbook vars, group_vars, or host_vars.

# Connection — ALL must be provided via inventory, group_vars, or extra-vars.
# No hardcoded defaults for host, port, key, secret, or verify_ssl.
# opn_host:
# opn_port:
# opn_key:
# opn_secret:
# opn_verify_ssl:

# Captive portal zones to ensure (list of dicts)
# Example:
#   opn_cp_zones:
#     - description: "Guest WiFi"
#       interfaces: "opt1"
#       idletimeout: 300
#       state: present
opn_cp_zones: []

# Cron jobs to ensure (list of dicts)
# Example:
#   opn_cron_jobs:
#     - description: "Nightly firmware check"
#       minutes: "0"
#       hours: "3"
#       command: "firmware probe"
#       state: present
opn_cron_jobs: []

# DDNS accounts to ensure (list of dicts)
# Example:
#   opn_ddns_accounts:
#     - description: "Cloudflare DDNS"
#       service: "cloudflare"
#       hostnames: "fw.example.com"
#       checkip: "web_dyndns"
#       username: "user@example.com"
#       password: "<api-token>"
#       state: present
opn_ddns_accounts: []

# Syslog destinations to ensure (list of dicts)
# Example:
#   opn_syslog_dests:
#     - description: "Central syslog"
#       hostname: "10.0.0.100"
#       transport: udp4
#       syslog_port: "514"
#       state: present
opn_syslog_dests: []
