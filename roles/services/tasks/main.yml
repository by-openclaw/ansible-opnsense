---
# Role: services — manage OPNsense captive portal, cron, DDNS, syslog.
#
# Variables (from defaults/main.yml):
#   opn_cp_zones:       list of captive portal zone dicts
#   opn_cron_jobs:      list of cron job dicts
#   opn_ddns_accounts:  list of DDNS account dicts
#   opn_syslog_dests:   list of syslog destination dicts
#
# Order: captive_portal_zones -> cron_jobs -> ddns_accounts -> syslog_dests.

- name: "Ensure captive portal zone {{ item.description | default('unknown') }}"
  by_systems.opnsense.opnsense_cp_zone:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    description: "{{ item.description }}"
    enabled: "{{ item.enabled | default(true) }}"
    interfaces: "{{ item.interfaces | default('') }}"
    authservers: "{{ item.authservers | default('') }}"
    idletimeout: "{{ item.idletimeout | default(0) }}"
    hardtimeout: "{{ item.hardtimeout | default(0) }}"
    concurrentlogins: "{{ item.concurrentlogins | default(true) }}"
    certificate: "{{ item.certificate | default('') }}"
    servername: "{{ item.servername | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_cp_zones }}"
  loop_control:
    label: "{{ item.description | default('unknown') }}"
  when: opn_cp_zones | length > 0

- name: "Ensure cron job {{ item.description | default('unknown') }}"
  by_systems.opnsense.opnsense_cron_job:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    description: "{{ item.description }}"
    enabled: "{{ item.enabled | default(true) }}"
    minutes: "{{ item.minutes | default('0') }}"
    hours: "{{ item.hours | default('0') }}"
    days: "{{ item.days | default('*') }}"
    months: "{{ item.months | default('*') }}"
    weekdays: "{{ item.weekdays | default('*') }}"
    command: "{{ item.command | default('') }}"
    who: "{{ item.who | default('root') }}"
    parameters: "{{ item.parameters | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_cron_jobs }}"
  loop_control:
    label: "{{ item.description | default('unknown') }}"
  when: opn_cron_jobs | length > 0

- name: "Ensure DDNS account {{ item.description | default('unknown') }}"
  by_systems.opnsense.opnsense_ddns_account:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    description: "{{ item.description }}"
    enabled: "{{ item.enabled | default(true) }}"
    service: "{{ item.service | default('') }}"
    protocol: "{{ item.protocol | default('') }}"
    server: "{{ item.server | default('') }}"
    username: "{{ item.username | default('') }}"
    password: "{{ item.password | default('') }}"
    hostnames: "{{ item.hostnames }}"
    checkip: "{{ item.checkip }}"
    interface: "{{ item.interface | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_ddns_accounts }}"
  loop_control:
    label: "{{ item.description | default('unknown') }}"
  when: opn_ddns_accounts | length > 0
  no_log: "{{ item.password is defined and item.password != '' }}"

- name: "Ensure syslog destination {{ item.description | default('unknown') }}"
  by_systems.opnsense.opnsense_syslog_dest:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    description: "{{ item.description }}"
    enabled: "{{ item.enabled | default(true) }}"
    transport: "{{ item.transport | default('udp4') }}"
    hostname: "{{ item.hostname }}"
    syslog_port: "{{ item.syslog_port | default('514') }}"
    rfc5424: "{{ item.rfc5424 | default(false) }}"
    certificate: "{{ item.certificate | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_syslog_dests }}"
  loop_control:
    label: "{{ item.description | default('unknown') }}"
  when: opn_syslog_dests | length > 0
