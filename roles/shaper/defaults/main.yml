---
# Role defaults — override in playbook vars, group_vars, or host_vars.

# Connection — ALL must be provided via inventory, group_vars, or extra-vars.
# No hardcoded defaults for host, port, key, secret, or verify_ssl.
# opn_host:
# opn_port:
# opn_key:
# opn_secret:
# opn_verify_ssl:

# Traffic shaper pipes to ensure (list of dicts)
# Example:
#   opn_ts_pipes:
#     - description: "pipe-wan-down"
#       bandwidth: 100
#       bandwidthMetric: Mbit
#       state: present
opn_ts_pipes: []

# Traffic shaper queues to ensure (list of dicts)
# Example:
#   opn_ts_queues:
#     - description: "queue-default"
#       weight: 50
#       state: present
opn_ts_queues: []

# Traffic shaper rules to ensure (list of dicts)
# Example:
#   opn_ts_rules:
#     - description: "shape-wan-https"
#       interface: wan
#       proto: tcp
#       dst_port: "443"
#       direction: in
#       state: present
opn_ts_rules: []
