---
# Role: shaper — manage OPNsense traffic shaper pipes, queues, and rules.
#
# Variables (from defaults/main.yml):
#   opn_ts_pipes:  list of traffic shaper pipe dicts
#   opn_ts_queues: list of traffic shaper queue dicts
#   opn_ts_rules:  list of traffic shaper rule dicts
#
# Order: pipes -> queues -> rules.
# Pipes first (queues need parent pipe), then rules (reference pipe/queue).

- name: "Ensure shaper pipe {{ item.description | default('unknown') }}"
  by_systems.opnsense.opnsense_ts_pipe:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    description: "{{ item.description }}"
    bandwidth: "{{ item.bandwidth }}"
    bandwidthMetric: "{{ item.bandwidthMetric | default('Mbit') }}"
    enabled: "{{ item.enabled | default(true) }}"
    delay: "{{ item.delay | default('') }}"
    mask: "{{ item.mask | default('none') }}"
    scheduler: "{{ item.scheduler | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_ts_pipes }}"
  loop_control:
    label: "{{ item.description | default('unknown') }}"
  when: opn_ts_pipes | length > 0

- name: "Ensure shaper queue {{ item.description | default('unknown') }}"
  by_systems.opnsense.opnsense_ts_queue:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    description: "{{ item.description }}"
    weight: "{{ item.weight | default(50) }}"
    enabled: "{{ item.enabled | default(true) }}"
    mask: "{{ item.mask | default('none') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_ts_queues }}"
  loop_control:
    label: "{{ item.description | default('unknown') }}"
  when: opn_ts_queues | length > 0

- name: "Ensure shaper rule {{ item.description | default('unknown') }}"
  by_systems.opnsense.opnsense_ts_rule:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    description: "{{ item.description }}"
    interface: "{{ item.interface }}"
    proto: "{{ item.proto | default('ip') }}"
    direction: "{{ item.direction | default('') }}"
    enabled: "{{ item.enabled | default(true) }}"
    sequence: "{{ item.sequence | default(omit) }}"
    src_port: "{{ item.src_port | default('') }}"
    dst_port: "{{ item.dst_port | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_ts_rules }}"
  loop_control:
    label: "{{ item.description | default('unknown') }}"
  when: opn_ts_rules | length > 0
