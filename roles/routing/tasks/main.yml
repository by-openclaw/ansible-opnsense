---
# Role: routing — manage OPNsense gateways and static routes.
#
# Variables (from defaults/main.yml):
#   opn_gateways: list of gateway dicts
#   opn_routes:   list of static route dicts
#
# Order: gateways first (routes reference gateways).
#
# Modules: opnsense_rt_gateway, opnsense_rt_route

- name: "Ensure gateway {{ item.name | default(item.description | default('unknown')) }}"
  by_systems.opnsense.opnsense_rt_gateway:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    name: "{{ item.name }}"
    interface: "{{ item.interface }}"
    gateway: "{{ item.gateway }}"
    monitor_disable: "{{ item.monitor_disable | default(false) }}"
    descr: "{{ item.descr | default('') }}"
    disabled: "{{ item.disabled | default(false) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_gateways }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"
  when: opn_gateways | length > 0

- name: "Ensure route {{ item.descr | default(item.network | default('unknown')) }}"
  by_systems.opnsense.opnsense_rt_route:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    network: "{{ item.network }}"
    gateway: "{{ item.gateway }}"
    descr: "{{ item.descr | default('') }}"
    disabled: "{{ item.disabled | default(false) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_routes }}"
  loop_control:
    label: "{{ item.descr | default(item.network | default('unknown')) }}"
  when: opn_routes | length > 0
