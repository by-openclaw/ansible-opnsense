---
# OPNsense inventory — one host per firewall instance.
# Credentials should come from group_vars or Ansible Vault.
#
# Usage:
#   ansible-playbook -i inventories/opnsense playbooks/playbook_auth_e2e.yml

all:
  hosts:
    opnsense-01:
      ansible_host: opnsense.example.com
      ansible_connection: local  # modules run locally, connect via API
