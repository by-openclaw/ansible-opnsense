---
# Role: trust — manage OPNsense certificate authorities and certificates.
#
# Variables (from defaults/main.yml):
#   opn_cas:   list of CA dicts
#   opn_certs: list of certificate dicts
#
# Order: CAs first (certificates need CA reference via caref).

- name: "Ensure CA {{ item.descr | default('unknown') }}"
  by_systems.opnsense.opnsense_trust_ca:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    descr: "{{ item.descr }}"
    action: "{{ item.action | default('internal') }}"
    key_type: "{{ item.key_type | default('') }}"
    digest: "{{ item.digest | default('') }}"
    lifetime: "{{ item.lifetime | default(omit) }}"
    commonname: "{{ item.commonname | default('') }}"
    country: "{{ item.country | default('') }}"
    province: "{{ item.province | default('') }}"
    city: "{{ item.city | default('') }}"
    organization: "{{ item.organization | default('') }}"
    email: "{{ item.email | default('') }}"
    crt_payload: "{{ item.crt_payload | default('') }}"
    prv_payload: "{{ item.prv_payload | default('') }}"
    caref: "{{ item.caref | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_cas }}"
  loop_control:
    label: "{{ item.descr | default('unknown') }}"
  when: opn_cas | length > 0
  no_log: "{{ item.prv_payload is defined and item.prv_payload != '' }}"

- name: "Ensure certificate {{ item.descr | default('unknown') }}"
  by_systems.opnsense.opnsense_trust_cert:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    descr: "{{ item.descr }}"
    caref: "{{ item.caref | default('') }}"
    action: "{{ item.action | default('internal') }}"
    key_type: "{{ item.key_type | default('') }}"
    digest: "{{ item.digest | default('') }}"
    cert_type: "{{ item.cert_type | default('server_cert') }}"
    lifetime: "{{ item.lifetime | default(omit) }}"
    commonname: "{{ item.commonname | default('') }}"
    altnames_dns: "{{ item.altnames_dns | default('') }}"
    altnames_ip: "{{ item.altnames_ip | default('') }}"
    country: "{{ item.country | default('') }}"
    province: "{{ item.province | default('') }}"
    city: "{{ item.city | default('') }}"
    organization: "{{ item.organization | default('') }}"
    email: "{{ item.email | default('') }}"
    crt_payload: "{{ item.crt_payload | default('') }}"
    prv_payload: "{{ item.prv_payload | default('') }}"
    csr_payload: "{{ item.csr_payload | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_certs }}"
  loop_control:
    label: "{{ item.descr | default('unknown') }}"
  when: opn_certs | length > 0
  no_log: "{{ item.prv_payload is defined and item.prv_payload != '' }}"
