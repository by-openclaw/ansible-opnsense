---
# Role defaults — override in playbook vars, group_vars, or host_vars.

# Connection — ALL must be provided via inventory, group_vars, or extra-vars.
# No hardcoded defaults for host, port, key, secret, or verify_ssl.
# opn_host:
# opn_port:
# opn_key:
# opn_secret:
# opn_verify_ssl:

# IPsec connections to ensure (list of dicts)
# Example:
#   opn_ipsec_conns:
#     - description: "site-to-site-remote"
#       version: "2"
#       dpd_delay: "30"
#       state: present
opn_ipsec_conns: []

# IPsec child SAs to ensure (list of dicts)
# Example:
#   opn_ipsec_children:
#     - description: "child-remote-lan"
#       connection: "<uuid-of-connection>"
#       mode: "tunnel"
#       state: present
opn_ipsec_children: []

# IPsec local auth configs to ensure (list of dicts)
# Example:
#   opn_ipsec_locals:
#     - description: "local-psk-auth"
#       connection: "<uuid-of-connection>"
#       auth: "psk"
#       state: present
opn_ipsec_locals: []

# IPsec remote auth configs to ensure (list of dicts)
# Example:
#   opn_ipsec_remotes:
#     - description: "remote-psk-auth"
#       connection: "<uuid-of-connection>"
#       auth: "psk"
#       state: present
opn_ipsec_remotes: []

# IPsec pre-shared keys to ensure (list of dicts)
# Example:
#   opn_ipsec_psks:
#     - description: "psk-remote-site"
#       ident: "10.0.0.1"
#       Key: "<secret-key>"
#       state: present
opn_ipsec_psks: []

# IPsec keypairs to ensure (list of dicts)
# Example:
#   opn_ipsec_keypairs:
#     - name: "kp-remote"
#       keyType: "rsa"
#       publicKey: "<pem-public>"
#       privateKey: "<pem-private>"
#       state: present
opn_ipsec_keypairs: []

# IPsec address pools to ensure (list of dicts)
# Example:
#   opn_ipsec_pools:
#     - name: "pool-roadwarrior"
#       addrs: "10.10.10.0/24"
#       dns: "10.0.0.1"
#       state: present
opn_ipsec_pools: []

# IPsec VTIs to ensure (list of dicts)
# Example:
#   opn_ipsec_vtis:
#     - description: "vti-remote"
#       reqid: "100"
#       local: "10.0.0.1"
#       remote: "10.0.0.2"
#       tunnel_local: "169.254.0.1/30"
#       tunnel_remote: "169.254.0.2/30"
#       state: present
opn_ipsec_vtis: []
