---
# Role: vpn_wireguard — manage OPNsense WireGuard servers and clients.
#
# Variables (from defaults/main.yml):
#   opn_wg_servers: list of WireGuard server (instance) dicts
#   opn_wg_clients: list of WireGuard client (peer) dicts
#
# Order: servers first (clients/peers reference server instances).

- name: "Ensure WireGuard server {{ item.name | default('unknown') }}"
  by_systems.opnsense.opnsense_wg_server:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    name: "{{ item.name }}"
    enabled: "{{ item.enabled | default(true) }}"
    listen_port: "{{ item.listen_port | default(omit) }}"
    mtu: "{{ item.mtu | default(omit) }}"
    tunneladdress: "{{ item.tunneladdress | default('') }}"
    dns: "{{ item.dns | default('') }}"
    disableroutes: "{{ item.disableroutes | default(false) }}"
    gateway: "{{ item.gateway | default('') }}"
    peers: "{{ item.peers | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_wg_servers }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"
  when: opn_wg_servers | length > 0

- name: "Ensure WireGuard client {{ item.name | default('unknown') }}"
  by_systems.opnsense.opnsense_wg_client:
    host: "{{ opn_host }}"
    key: "{{ opn_key }}"
    secret: "{{ opn_secret }}"
    port: "{{ opn_port }}"
    verify_ssl: "{{ opn_verify_ssl }}"
    name: "{{ item.name }}"
    enabled: "{{ item.enabled | default(true) }}"
    pubkey: "{{ item.pubkey | default('') }}"
    psk: "{{ item.psk | default('') }}"
    tunneladdress: "{{ item.tunneladdress | default('') }}"
    serveraddress: "{{ item.serveraddress | default('') }}"
    serverport: "{{ item.serverport | default(omit) }}"
    keepalive: "{{ item.keepalive | default(0) }}"
    endpoint: "{{ item.endpoint | default('') }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opn_wg_clients }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"
  when: opn_wg_clients | length > 0
  no_log: "{{ item.psk is defined and item.psk != '' }}"
