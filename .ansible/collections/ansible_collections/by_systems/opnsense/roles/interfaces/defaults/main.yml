---
# Role defaults — override in playbook vars, group_vars, or host_vars.

# Connection — ALL must be provided via inventory, group_vars, or extra-vars.
# No hardcoded defaults for host, port, key, secret, or verify_ssl.
# opn_host:
# opn_port:
# opn_key:
# opn_secret:
# opn_verify_ssl:

# VLANs to ensure (list of dicts)
# Example:
#   opn_vlans:
#     - tag: 100
#       if_parent: vtnet1
#       descr: "Management VLAN"
#       state: present
opn_vlans: []

# Virtual IPs to ensure (list of dicts)
# Example:
#   opn_vips:
#     - address: "10.0.0.1"
#       interface: lan
#       mode: ipalias
#       network: "/24"
#       state: present
opn_vips: []

# Bridges to ensure (list of dicts)
# Example:
#   opn_bridges:
#     - descr: "br-dmz"
#       state: present
opn_bridges: []

# Loopback interfaces to ensure (list of dicts)
# Example:
#   opn_loopbacks:
#     - description: "lo-mgmt"
#       state: present
opn_loopbacks: []

# Static NDP neighbors to ensure (list of dicts)
# Example:
#   opn_neighbors:
#     - ipaddress: "10.0.0.5"
#       etheraddr: "00:11:22:33:44:55"
#       descr: "switch-01"
#       state: present
opn_neighbors: []

# VXLANs to ensure (list of dicts)
# Example:
#   opn_vxlans:
#     - vxlanid: 100
#       vxlanlocal: "10.0.0.1"
#       vxlanremote: "10.0.0.2"
#       state: present
opn_vxlans: []

# GIF tunnels to ensure (list of dicts)
# Example:
#   opn_gifs:
#     - tunnel_local_addr: "10.0.0.1"
#       tunnel_remote_addr: "10.0.0.2"
#       descr: "gif-to-remote"
#       state: present
opn_gifs: []

# GRE tunnels to ensure (list of dicts)
# Example:
#   opn_gres:
#     - tunnel_local_addr: "10.0.0.1"
#       tunnel_remote_addr: "10.0.0.2"
#       descr: "gre-to-remote"
#       state: present
opn_gres: []

# LAGG interfaces to ensure (list of dicts)
# Example:
#   opn_laggs:
#     - descr: "lagg-trunk"
#       proto: lacp
#       state: present
opn_laggs: []
