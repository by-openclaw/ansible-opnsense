---
# test_errors.yml — Trust (CA/Cert) error-handling + input validation tests
#
# Copyright BY-SYSTEMS SRL
# SPDX-License-Identifier: Apache-2.0
# https://github.com/by-openclaw/ansible-opnsense
#
# What it tests (7 cases):
#   1. 401 — bad credentials on trust_ca
#   2. Timeout — unreachable host 192.0.2.1 on trust_cert
#   3. Validation — empty CA descr (required)
#   4. Validation — empty cert descr (required)
#   5. Validation — bad CA action enum "INVALID"
#   6. Validation — bad cert action enum "INVALID"
#   7. Validation — bad cert cert_type enum "INVALID"
#
# Static enums (choices in module — Ansible validates before pylib):
#   - state: present, absent
#   - ca action: existing, internal, ocsp
#   - cert action: internal, external, import, import_csr, manual, reissue, sign_csr
#   - cert_type: usr_cert, server_cert, combined_server_client, v3_ca
#
# Dynamic fields (type: str — no Ansible choices, pylib or API validates):
#   - caref, certificate
#
# Run:
#   ansible-playbook playbooks/trust/test_errors.yml \
#     -e opn_host=10.6.239.114 -e opn_key=<key> -e opn_secret=<secret> -v

- name: "Trust (CA/Cert) error handling + input validation"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    opn_port: 443
    opn_verify_ssl: false

  tasks:
    # ── 1. Transport: 401 Unauthorized ──────────────────────────────────
    - name: "1. Error — 401 bad credentials on trust_ca"
      by_systems.opnsense.opnsense_trust_ca:
        host: "{{ opn_host }}"
        key: "BADKEY000000000000000"
        secret: "BADSECRET0000000000000000000000000000000"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        descr: inttest-err-ca
        action: internal
        commonname: inttest-err-ca.example.com
        country: BE
        state: present
      register: r
      failed_when: false

    - name: "1. Assert 401 caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)authentication.*(failed|401)')
        fail_msg: "Expected 401 auth error, got: {{ r.msg | default('no msg') }}"

    # ── 2. Transport: timeout ───────────────────────────────────────────
    - name: "2. Error — timeout on unreachable 192.0.2.1 (trust_cert)"
      by_systems.opnsense.opnsense_trust_cert:
        host: "192.0.2.1"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        descr: inttest-err-cert
        action: internal
        state: present
      register: r
      failed_when: false

    - name: "2. Assert timeout caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(timed.out|connection.failed)')
        fail_msg: "Expected timeout, got: {{ r.msg | default('no msg') }}"

    # ── 3. Validation: empty CA descr ───────────────────────────────────
    - name: "3. Error — empty CA descr (required)"
      by_systems.opnsense.opnsense_trust_ca:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        descr: ""
        action: internal
        commonname: inttest-err-ca.example.com
        country: BE
        state: present
      register: r
      failed_when: false

    - name: "3. Assert FieldValidationError on CA descr"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|descr)')
        fail_msg: "Expected validation error on empty descr, got: {{ r.msg | default('no msg') }}"

    # ── 4. Validation: empty cert descr ─────────────────────────────────
    - name: "4. Error — empty cert descr (required)"
      by_systems.opnsense.opnsense_trust_cert:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        descr: ""
        action: internal
        state: present
      register: r
      failed_when: false

    - name: "4. Assert FieldValidationError on cert descr"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|descr)')
        fail_msg: "Expected validation error on empty descr, got: {{ r.msg | default('no msg') }}"

    # ── 5. Validation: bad CA action enum ───────────────────────────────
    - name: "5. Error — bad CA action enum INVALID"
      by_systems.opnsense.opnsense_trust_ca:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        descr: inttest-err-ca-action
        action: "INVALID"
        commonname: inttest-err-ca.example.com
        country: BE
        state: present
      register: r
      failed_when: false

    - name: "5. Assert validation error on bad CA action enum"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|action|must be)')
        fail_msg: "Expected validation error on bad action, got: {{ r.msg | default('no msg') }}"

    # ── 6. Validation: bad cert action enum ─────────────────────────────
    - name: "6. Error — bad cert action enum INVALID"
      by_systems.opnsense.opnsense_trust_cert:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        descr: inttest-err-cert-action
        action: "INVALID"
        state: present
      register: r
      failed_when: false

    - name: "6. Assert validation error on bad cert action enum"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|action|must be)')
        fail_msg: "Expected validation error on bad action, got: {{ r.msg | default('no msg') }}"

    # ── 7. Validation: bad cert cert_type enum ──────────────────────────
    - name: "7. Error — bad cert cert_type enum INVALID"
      by_systems.opnsense.opnsense_trust_cert:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        descr: inttest-err-cert-type
        action: internal
        cert_type: "INVALID"
        state: present
      register: r
      failed_when: false

    - name: "7. Assert validation error on bad cert_type enum"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|cert_type|must be)')
        fail_msg: "Expected validation error on bad cert_type, got: {{ r.msg | default('no msg') }}"

    # ── Result ──────────────────────────────────────────────────────────
    - name: "PASS"
      ansible.builtin.debug:
        msg: "PASS — Trust error handling: 401, timeout, empty CA/cert descr, bad CA/cert action, bad cert_type all caught."
