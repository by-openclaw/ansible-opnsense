---
# Manage OPNsense auth (users, groups, privileges) using the auth role.
#
# Usage with inventory:
#   ansible-playbook -i inventories/opnsense playbooks/playbook_auth.yml \
#     -e opn_key=<key> -e opn_secret=<secret>
#
# Usage with extra-vars (no inventory):
#   ansible-playbook playbooks/playbook_auth.yml \
#     -e opn_host=10.6.224.106 -e opn_key=<key> -e opn_secret=<secret>
#
# With vault:
#   ansible-playbook -i inventories/opnsense playbooks/playbook_auth.yml \
#     --ask-vault-pass

- name: OPNsense Auth Management
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    opn_groups:
      - name: grp-automation
        description: "Automation and CI service accounts"
        state: present
      - name: grp-monitoring
        description: "Monitoring read-only accounts"
        state: present

    opn_users:
      - name: svc-ansible
        email: ansible@example.com
        description: "Ansible automation account"
        state: present
      - name: svc-monitoring
        email: monitoring@example.com
        description: "Monitoring read-only account"
        state: present

    opn_privileges:
      - priv_id: page-all
        target_type: group
        target_name: grp-automation
        state: present
      - priv_id: page-diagnostics-arptable
        target_type: group
        target_name: grp-monitoring
        state: present
      - priv_id: page-status-interfaces
        target_type: group
        target_name: grp-monitoring
        state: present

  roles:
    - auth
