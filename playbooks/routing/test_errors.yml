---
# test_errors.yml — Routing domain error handling + input validation
#
# What it tests (matching pylib 10-step error coverage):
#   1. 401 — bad credentials on gateway → "Authentication failed"
#   2. Timeout — unreachable host 192.0.2.1 on route → "timed out" or "Connection failed"
#   3. Empty gateway name (required) → FieldValidationError
#   4. Empty route network (required) → FieldValidationError
#
# Static enums (choices in module — Ansible validates before pylib):
#   - ipprotocol: inet, inet6
#   - state: present, absent
#
# Dynamic fields (type: str — no Ansible choices, pylib or API validates):
#   - interface, gateway
#
# Regex used in asserts for robust error matching across versions.
#
# Verbosity:
#   -v    → INFO logging in tests/integration/logs/ansible-{date}.log
#   -vv   → DEBUG logging (all HTTP calls + manager actions)
#
# Run:
#   ansible-playbook playbooks/routing/test_errors.yml \
#     -e opn_host=10.6.239.114 -e opn_key=<key> -e opn_secret=<secret> -v

- name: "Routing error handling + input validation"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    opn_port: 443
    opn_verify_ssl: false

  tasks:
    # ── 1. Transport: 401 Unauthorized ──────────────────────────────────
    - name: "1. Error — 401 bad credentials on gateway"
      by_systems.opnsense.opnsense_rt_gateway:
        host: "{{ opn_host }}"
        key: "BADKEY000000000000000"
        secret: "BADSECRET0000000000000000000000000000000"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "e2e-should-not-exist"
        interface: lan
        gateway: "10.11.1.1"
        state: present
      register: r
      failed_when: false

    - name: "1. Assert 401 caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)authentication.*(failed|401)')
        fail_msg: "Expected 401 auth error, got: {{ r.msg | default('no msg') }}"

    # ── 2. Transport: timeout ───────────────────────────────────────────
    - name: "2. Error — timeout on unreachable 192.0.2.1 (route)"
      by_systems.opnsense.opnsense_rt_route:
        host: "192.0.2.1"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        network: "10.99.0.0/24"
        gateway: "Null4"
        state: present
      register: r
      failed_when: false

    - name: "2. Assert timeout caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(timed.out|connection.failed)')
        fail_msg: "Expected timeout, got: {{ r.msg | default('no msg') }}"

    # ── 3. Validation: empty gateway name (required) ────────────────────
    - name: "3. Error — empty gateway name"
      by_systems.opnsense.opnsense_rt_gateway:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: ""
        interface: lan
        gateway: "10.11.1.1"
        state: present
      register: r
      failed_when: false

    - name: "3. Assert empty name caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|name)')
        fail_msg: "Expected validation error on empty name, got: {{ r.msg | default('no msg') }}"

    # ── 4. Validation: empty route network (required) ───────────────────
    - name: "4. Error — empty route network"
      by_systems.opnsense.opnsense_rt_route:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        network: ""
        gateway: "Null4"
        state: present
      register: r
      failed_when: false

    - name: "4. Assert empty network caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|network)')
        fail_msg: "Expected validation error on empty network, got: {{ r.msg | default('no msg') }}"

    # ── Result ──────────────────────────────────────────────────────────
    - name: "PASS"
      ansible.builtin.debug:
        msg: "PASS — Routing error handling: 401, timeout, empty name, empty network all caught."
