---
# test_errors.yml — Interfaces domain error handling + input validation
#
# What it tests (matching pylib 10-step error coverage):
#   1. 401 — bad credentials on VLAN → "Authentication failed"
#   2. Timeout — unreachable host 192.0.2.1 on VIP → "timed out" or "Connection failed"
#   3. VLAN tag=0 (int min=1) → FieldValidationError
#   4. VLAN tag=abc (int not numeric) → Ansible type coercion error
#   5. Bad VIP mode "invalid" → Ansible argument_spec choices rejection
#   6. Empty loopback description (required) → FieldValidationError
#   7. Empty GIF tunnel-local-addr (required) → FieldValidationError
#
# Static enums (choices in module — Ansible validates before pylib):
#   - mode: ipalias, carp, proxyarp
#   - proto: "", 802.1q, 802.1ad
#   - state: present, absent
#
# Dynamic fields (type: str — no Ansible choices, pylib or API validates):
#   - interface, if (parent)
#
# Regex used in asserts for robust error matching across versions.
#
# Verbosity:
#   -v    → INFO logging in tests/integration/logs/ansible-{date}.log
#   -vv   → DEBUG logging (all HTTP calls + manager actions)
#
# Run:
#   ansible-playbook playbooks/interfaces/test_errors.yml \
#     -e opn_host=10.6.239.114 -e opn_key=<key> -e opn_secret=<secret> -v

- name: "Interfaces error handling + input validation"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    opn_port: 443
    opn_verify_ssl: false

  tasks:
    # ── 1. Transport: 401 Unauthorized ──────────────────────────────────
    - name: "1. Error — 401 bad credentials on VLAN"
      by_systems.opnsense.opnsense_if_vlan:
        host: "{{ opn_host }}"
        key: "BADKEY000000000000000"
        secret: "BADSECRET0000000000000000000000000000000"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        tag: 3998
        if_parent: vtnet0
        state: present
      register: r
      failed_when: false

    - name: "1. Assert 401 caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)authentication.*(failed|401)')
        fail_msg: "Expected 401 auth error, got: {{ r.msg | default('no msg') }}"

    # ── 2. Transport: timeout ───────────────────────────────────────────
    - name: "2. Error — timeout on unreachable 192.0.2.1 (VIP)"
      by_systems.opnsense.opnsense_if_vip:
        host: "192.0.2.1"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        address: "10.0.0.100"
        interface: "lan"
        mode: "ipalias"
        state: present
      register: r
      failed_when: false

    - name: "2. Assert timeout caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(timed.out|connection.failed)')
        fail_msg: "Expected timeout, got: {{ r.msg | default('no msg') }}"

    # ── 3. Validation: VLAN tag=0 (int min=1) ──────────────────────────
    - name: "3. Error — VLAN tag=0 below minimum"
      by_systems.opnsense.opnsense_if_vlan:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        tag: 0
        if_parent: vtnet0
        state: present
      register: r
      failed_when: false

    - name: "3. Assert VLAN tag min caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|tag|min)')
        fail_msg: "Expected validation error on tag=0, got: {{ r.msg | default('no msg') }}"

    # ── 4. Validation: VLAN tag=abc (not integer) ───────────────────────
    - name: "4. Error — VLAN tag=abc not numeric"
      by_systems.opnsense.opnsense_if_vlan:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        tag: "abc"
        if_parent: vtnet0
        state: present
      register: r
      failed_when: false

    - name: "4. Assert non-integer tag caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|tag|integer|int|cannot)')
        fail_msg: "Expected integer validation error, got: {{ r.msg | default('no msg') }}"

    # ── 5. Validation: bad VIP mode enum ────────────────────────────────
    - name: "5. Error — bad VIP mode invalid"
      by_systems.opnsense.opnsense_if_vip:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        address: "10.0.0.100"
        interface: "lan"
        mode: "invalid"
        state: present
      register: r
      failed_when: false

    - name: "5. Assert bad VIP mode caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|mode|must be)')
        fail_msg: "Expected mode validation error, got: {{ r.msg | default('no msg') }}"

    # ── 6. Validation: empty loopback description (required) ────────────
    - name: "6. Error — empty loopback description"
      by_systems.opnsense.opnsense_if_loopback:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: ""
        state: present
      register: r
      failed_when: false

    - name: "6. Assert empty description caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|description)')
        fail_msg: "Expected validation error on empty description, got: {{ r.msg | default('no msg') }}"

    # ── 7. Validation: empty GIF tunnel-local-addr (required) ───────────
    - name: "7. Error — empty GIF tunnel-local-addr"
      by_systems.opnsense.opnsense_if_gif:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        tunnel_local_addr: ""
        tunnel_remote_addr: "10.0.0.2"
        state: present
      register: r
      failed_when: false

    - name: "7. Assert empty tunnel-local-addr caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|tunnel)')
        fail_msg: "Expected validation error on empty tunnel addr, got: {{ r.msg | default('no msg') }}"

    # ── Result ──────────────────────────────────────────────────────────
    - name: "PASS"
      ansible.builtin.debug:
        msg: "PASS — Interfaces error handling: 401, timeout, tag min, tag type, bad mode, empty description, empty tunnel all caught."
