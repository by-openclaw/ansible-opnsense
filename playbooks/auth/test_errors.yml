---
# test_errors.yml — Auth module error handling + input validation
#
# What it tests (matching pylib 10-step error coverage):
#   1. 401 — bad credentials → "Authentication failed"
#   2. Timeout — unreachable host 192.0.2.1 → "timed out" or "Connection failed"
#   3. Bad enum — invalid shell value → caught by pylib FieldValidationError
#   4. Missing required — empty name → caught by pylib FieldValidationError
#   5. Bad email — malformed address → caught by pylib FieldValidationError
#   6. Bad state — invalid state param → caught by Ansible argument_spec (choices)
#
# Static enums (choices in module — Ansible validates before pylib):
#   - state: present, absent
#   - disabled: true, false (Ansible bool → "1"/"0")
#
# Dynamic fields (type: str — no Ansible choices, pylib or API validates):
#   - name, email, password, group_memberships
#
# Regex used in asserts for robust error matching across versions.
#
# Verbosity:
#   -v    → INFO logging in tests/integration/logs/ansible-{date}.log
#   -vv   → DEBUG logging (all HTTP calls + manager actions)
#
# Run:
#   ansible-playbook playbooks/auth/test_errors.yml \
#     -e opn_host=10.6.239.114 -e opn_key=<key> -e opn_secret=<secret> -v

- name: "Auth error handling + input validation"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    opn_port: 443
    opn_verify_ssl: false

  tasks:
    # ── 1. Transport: 401 Unauthorized ──────────────────────────────────
    - name: "1. Error — 401 bad credentials"
      by_systems.opnsense.opnsense_auth_group:
        host: "{{ opn_host }}"
        key: "BADKEY000000000000000"
        secret: "BADSECRET0000000000000000000000000000000"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "e2e-should-not-exist"
        state: present
      register: r
      failed_when: false

    - name: "1. Assert 401 caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)authentication.*(failed|401)')
        fail_msg: "Expected 401 auth error, got: {{ r.msg | default('no msg') }}"

    # ── 2. Transport: timeout ───────────────────────────────────────────
    - name: "2. Error — timeout on unreachable 192.0.2.1"
      by_systems.opnsense.opnsense_auth_user:
        host: "192.0.2.1"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "e2e-timeout"
        state: present
      register: r
      failed_when: false

    - name: "2. Assert timeout caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(timed.out|connection.failed)')
        fail_msg: "Expected timeout, got: {{ r.msg | default('no msg') }}"

    # ── 3. Validation: missing required field ───────────────────────────
    - name: "3. Error — empty group name (required field)"
      by_systems.opnsense.opnsense_auth_group:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: ""
        state: present
      register: r
      failed_when: false

    - name: "3. Assert FieldValidationError caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|missing)')
        fail_msg: "Expected validation error on empty name, got: {{ r.msg | default('no msg') }}"

    # ── 4. Validation: empty user name ──────────────────────────────────
    - name: "4. Error — empty user name"
      by_systems.opnsense.opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: ""
        state: present
      register: r
      failed_when: false

    - name: "4. Assert FieldValidationError on user name"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|name)')
        fail_msg: "Expected validation error, got: {{ r.msg | default('no msg') }}"

    # ── 5. Validation: bad email format ─────────────────────────────────
    - name: "5. Error — malformed email address"
      by_systems.opnsense.opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "e2e-bad-email"
        email: "not-an-email"
        state: present
      register: r
      failed_when: false

    - name: "5. Assert email validation caught"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|email|valid)')
        fail_msg: "Expected email validation error, got: {{ r.msg | default('no msg') }}"

    # ── 6. Validation: name with invalid chars ──────────────────────────
    - name: "6. Error — user name with special chars"
      by_systems.opnsense.opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "bad name!@#$"
        state: present
      register: r
      failed_when: false

    - name: "6. Assert regex validation caught"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|pattern|match)')
        fail_msg: "Expected regex validation error, got: {{ r.msg | default('no msg') }}"

    # ── Result ──────────────────────────────────────────────────────────
    - name: "PASS"
      ansible.builtin.debug:
        msg: "PASS — Auth error handling: 401, timeout, empty required, bad email, bad regex all caught."
