---
# End-to-end test playbook for OPNsense auth modules
# Runs the full auth lifecycle against a live device.
#
# Usage:
#   ansible-playbook playbooks/playbook_auth_e2e.yml \
#     -e opn_host=10.6.224.106 \
#     -e opn_key=<api_key> \
#     -e opn_secret=<api_secret>
#
# All test objects use 'e2e-' prefix and are cleaned up at the end.

- name: OPNsense Auth End-to-End Test
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    opn_port: 443
    opn_verify_ssl: false
    # Test object names
    test_user_1: e2e-alice
    test_user_2: e2e-bob
    test_group_1: e2e-engineers
    test_group_2: e2e-operators
    test_priv: page-diagnostics-arptable
    test_password: "E2eT3stP@ss!"

  tasks:
    # ==================================================================
    # 1. CRUD Group
    # ==================================================================
    - name: "1.1 Create group {{ test_group_1 }}"
      by_systems.opnsense.opnsense_auth_group:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_group_1 }}"
        description: "E2E test group 1"
        state: present
      register: grp1_result

    - name: "1.1 Verify created"
      ansible.builtin.assert:
        that:
          - grp1_result.changed
          - grp1_result.action in ['created', 'updated']

    - name: "1.2 Create group {{ test_group_2 }}"
      by_systems.opnsense.opnsense_auth_group:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_group_2 }}"
        description: "E2E test group 2"
        state: present
      register: grp2_result

    - name: "1.3 Idempotent — re-create group (should be noop)"
      by_systems.opnsense.opnsense_auth_group:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_group_1 }}"
        description: "E2E test group 1"
        state: present
      register: grp1_noop

    - name: "1.3 Verify noop"
      ansible.builtin.assert:
        that:
          - not grp1_noop.changed
          - grp1_noop.action == 'noop'

    # ==================================================================
    # 2. CRUD User
    # ==================================================================
    - name: "2.1 Create user {{ test_user_1 }}"
      by_systems.opnsense.opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_user_1 }}"
        email: "alice@example.com"
        password: "{{ test_password }}"
        state: present
      register: user1_result

    - name: "2.1 Verify created"
      ansible.builtin.assert:
        that:
          - user1_result.changed
          - user1_result.action in ['created', 'updated']

    - name: "2.2 Create user {{ test_user_2 }}"
      by_systems.opnsense.opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_user_2 }}"
        email: "bob@example.com"
        password: "{{ test_password }}"
        state: present

    - name: "2.3 Update user email"
      by_systems.opnsense.opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_user_1 }}"
        email: "alice-updated@example.com"
        state: present
      register: user1_update

    - name: "2.3 Verify updated"
      ansible.builtin.assert:
        that:
          - user1_update.changed
          - user1_update.action == 'updated'

    - name: "2.4 Idempotent — re-update (should be noop)"
      by_systems.opnsense.opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_user_1 }}"
        email: "alice-updated@example.com"
        state: present
      register: user1_noop

    - name: "2.4 Verify noop"
      ansible.builtin.assert:
        that:
          - not user1_noop.changed
          - user1_noop.action == 'noop'

    # ==================================================================
    # 3. Check mode
    # ==================================================================
    - name: "3.1 Check mode delete (should not actually delete)"
      by_systems.opnsense.opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_user_1 }}"
        state: absent
      check_mode: true
      register: check_delete

    - name: "3.1 Verify check mode reports changed but user still exists"
      ansible.builtin.assert:
        that:
          - check_delete.changed
          - check_delete.action == 'deleted'

    - name: "3.2 Verify user still exists after check mode"
      by_systems.opnsense.opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_user_1 }}"
        email: "alice-updated@example.com"
        state: present
      register: still_exists

    - name: "3.2 Verify noop (user was not deleted)"
      ansible.builtin.assert:
        that:
          - not still_exists.changed

    # ==================================================================
    # 4. Privilege assignment
    # ==================================================================
    - name: "4.1 Assign privilege to group"
      by_systems.opnsense.opnsense_auth_priv:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        priv_id: "{{ test_priv }}"
        target_type: group
        target_name: "{{ test_group_1 }}"
        state: present
      register: priv_assign

    - name: "4.1 Verify assigned"
      ansible.builtin.assert:
        that:
          - priv_assign.changed
          - priv_assign.action == 'created'

    - name: "4.2 Idempotent — re-assign (should be noop)"
      by_systems.opnsense.opnsense_auth_priv:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        priv_id: "{{ test_priv }}"
        target_type: group
        target_name: "{{ test_group_1 }}"
        state: present
      register: priv_noop

    - name: "4.2 Verify noop"
      ansible.builtin.assert:
        that:
          - not priv_noop.changed

    - name: "4.3 Assign privilege to user"
      by_systems.opnsense.opnsense_auth_priv:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        priv_id: "{{ test_priv }}"
        target_type: user
        target_name: "{{ test_user_1 }}"
        state: present

    # ==================================================================
    # 5. API key CRUD
    # ==================================================================
    - name: "5.1 Create API key for user"
      by_systems.opnsense.opnsense_auth_api_key:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        username: "{{ test_user_2 }}"
        state: present
      register: apikey_result
      no_log: true

    - name: "5.1 Verify key created"
      ansible.builtin.assert:
        that:
          - apikey_result.changed
          - apikey_result.action == 'created'

    - name: "5.2 Delete all API keys for user"
      by_systems.opnsense.opnsense_auth_api_key:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        username: "{{ test_user_2 }}"
        state: absent
      register: apikey_delete

    - name: "5.2 Verify keys deleted"
      ansible.builtin.assert:
        that:
          - apikey_delete.changed
          - apikey_delete.action == 'deleted'

    # ==================================================================
    # 6. Error handling — verify Ansible catches errors gracefully
    # ==================================================================
    - name: "6.1 Attempt operation with invalid credentials"
      by_systems.opnsense.opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "invalid-key"
        secret: "invalid-secret"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "should-fail"
        state: present
      register: auth_error
      ignore_errors: true

    - name: "6.1 Verify auth error caught (not a crash)"
      ansible.builtin.assert:
        that:
          - auth_error.failed
          - "'Authentication failed' in auth_error.msg or '401' in auth_error.msg"

    # ==================================================================
    # 7. Cleanup — delete all test objects
    # ==================================================================
    - name: "7.1 Unassign privilege from group"
      by_systems.opnsense.opnsense_auth_priv:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        priv_id: "{{ test_priv }}"
        target_type: group
        target_name: "{{ test_group_1 }}"
        state: absent

    - name: "7.2 Unassign privilege from user"
      by_systems.opnsense.opnsense_auth_priv:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        priv_id: "{{ test_priv }}"
        target_type: user
        target_name: "{{ test_user_1 }}"
        state: absent

    - name: "7.3 Delete test users"
      by_systems.opnsense.opnsense_auth_user:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ test_user_1 }}"
        - "{{ test_user_2 }}"

    - name: "7.4 Delete test groups"
      by_systems.opnsense.opnsense_auth_group:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ test_group_1 }}"
        - "{{ test_group_2 }}"

    - name: "7.5 Final — all tests passed"
      ansible.builtin.debug:
        msg: "End-to-end auth test completed successfully. All test objects cleaned up."
