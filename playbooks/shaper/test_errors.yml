---
# test_errors.yml — Traffic Shaper error-handling + input validation tests
#
# Copyright BY-SYSTEMS SRL
# SPDX-License-Identifier: Apache-2.0
# https://github.com/by-openclaw/ansible-opnsense
#
# What it tests (7 cases):
#   1. 401 — bad credentials on ts_pipe
#   2. Timeout — unreachable host 192.0.2.1 on ts_rule
#   3. Validation — empty pipe description (required)
#   4. Validation — pipe bandwidth=0 (int min=1)
#   5. Validation — bad pipe scheduler enum "INVALID"
#   6. Validation — bad rule proto enum "INVALID"
#   7. Validation — empty queue description (required)
#
# Static enums (choices in module — Ansible validates before pylib):
#   - state: present, absent
#   - bandwidthMetric: bit, Kbit, Mbit, Gbit
#   - mask: none, src-ip, dst-ip, src-ip6, dst-ip6
#   - scheduler: "", fifo, rr, qfq, fq_codel, fq_pie
#   - proto: ip, ip4, ip6, udp, tcp, icmp, esp, ah, gre, igmp,
#            ipv6-icmp, tcp_ack, tcp_ack_not
#   - direction: "", in, out
#
# Dynamic fields (type: str — no Ansible choices, pylib or API validates):
#   - interface
#
# Run:
#   ansible-playbook playbooks/shaper/test_errors.yml \
#     -e opn_host=10.6.239.114 -e opn_key=<key> -e opn_secret=<secret> -v

- name: "Traffic Shaper error handling + input validation"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    opn_port: 443
    opn_verify_ssl: false

  tasks:
    # ── 1. Transport: 401 Unauthorized ──────────────────────────────────
    - name: "1. Error — 401 bad credentials on ts_pipe"
      by_systems.opnsense.opnsense_ts_pipe:
        host: "{{ opn_host }}"
        key: "BADKEY000000000000000"
        secret: "BADSECRET0000000000000000000000000000000"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: inttest-err-pipe
        bandwidth: 10
        bandwidthMetric: Mbit
        state: present
      register: r
      failed_when: false

    - name: "1. Assert 401 caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)authentication.*(failed|401)')
        fail_msg: "Expected 401 auth error, got: {{ r.msg | default('no msg') }}"

    # ── 2. Transport: timeout ───────────────────────────────────────────
    - name: "2. Error — timeout on unreachable 192.0.2.1 (ts_rule)"
      by_systems.opnsense.opnsense_ts_rule:
        host: "192.0.2.1"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: inttest-err-rule
        interface: lan
        state: present
      register: r
      failed_when: false

    - name: "2. Assert timeout caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(timed.out|connection.failed)')
        fail_msg: "Expected timeout, got: {{ r.msg | default('no msg') }}"

    # ── 3. Validation: empty pipe description ───────────────────────────
    - name: "3. Error — empty pipe description (required)"
      by_systems.opnsense.opnsense_ts_pipe:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: ""
        bandwidth: 10
        bandwidthMetric: Mbit
        state: present
      register: r
      failed_when: false

    - name: "3. Assert FieldValidationError on pipe description"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|description)')
        fail_msg: "Expected validation error on empty description, got: {{ r.msg | default('no msg') }}"

    # ── 4. Validation: pipe bandwidth=0 (min=1) ────────────────────────
    - name: "4. Error — pipe bandwidth=0 (int min=1)"
      by_systems.opnsense.opnsense_ts_pipe:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: inttest-err-bw
        bandwidth: 0
        bandwidthMetric: Mbit
        state: present
      register: r
      failed_when: false

    - name: "4. Assert FieldValidationError on bandwidth min"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|bandwidth|min)')
        fail_msg: "Expected bandwidth min validation error, got: {{ r.msg | default('no msg') }}"

    # ── 5. Validation: bad pipe scheduler enum ──────────────────────────
    - name: "5. Error — bad pipe scheduler enum INVALID"
      by_systems.opnsense.opnsense_ts_pipe:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: inttest-err-sched
        bandwidth: 10
        bandwidthMetric: Mbit
        scheduler: "INVALID"
        state: present
      register: r
      failed_when: false

    - name: "5. Assert validation error on bad scheduler enum"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|scheduler|must be)')
        fail_msg: "Expected validation error on bad scheduler, got: {{ r.msg | default('no msg') }}"

    # ── 6. Validation: bad rule proto enum ──────────────────────────────
    - name: "6. Error — bad rule proto enum INVALID"
      by_systems.opnsense.opnsense_ts_rule:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: inttest-err-proto
        interface: lan
        proto: "INVALID"
        state: present
      register: r
      failed_when: false

    - name: "6. Assert validation error on bad proto enum"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|proto|must be)')
        fail_msg: "Expected validation error on bad proto, got: {{ r.msg | default('no msg') }}"

    # ── 7. Validation: empty queue description ──────────────────────────
    - name: "7. Error — empty queue description (required)"
      by_systems.opnsense.opnsense_ts_queue:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: ""
        state: present
      register: r
      failed_when: false

    - name: "7. Assert FieldValidationError on queue description"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|description)')
        fail_msg: "Expected validation error on empty description, got: {{ r.msg | default('no msg') }}"

    # ── Result ──────────────────────────────────────────────────────────
    - name: "PASS"
      ansible.builtin.debug:
        msg: "PASS — Shaper error handling: 401, timeout, empty pipe/queue desc, bad bandwidth, bad scheduler, bad proto all caught."
