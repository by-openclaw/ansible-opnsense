---
# test_errors.yml — DNS (Unbound) error handling + input validation
#
# What it tests (matching pylib 10-step error coverage):
#   1. 401 — bad credentials → "Authentication failed"
#   2. Timeout — unreachable host 192.0.2.1 → "timed out" or "Connection failed"
#   3. Missing required — empty hostname → caught by pylib FieldValidationError
#   4. Bad enum — invalid ACL action → caught by Ansible argument_spec (choices)
#   5. Bad enum — invalid host_override rr → caught by Ansible argument_spec (choices)
#   6. Missing required — empty DoT server → caught by Ansible argument_spec (required)
#
# Static enums (choices in module — Ansible validates before pylib):
#   - rr: A, AAAA, MX, TXT
#   - action: allow, deny, refuse, allow_snoop, deny_non_local, refuse_non_local
#   - type (dot): dot
#   - type (forward): forward, stub
#   - state: present, absent
#
# Dynamic fields (type: str — no Ansible choices, pylib or API validates):
#   - hostname, domain, server, networks
#
# Regex used in asserts for robust error matching across versions.
#
# Verbosity:
#   -v    → INFO logging in tests/integration/logs/ansible-{date}.log
#   -vv   → DEBUG logging (all HTTP calls + manager actions)
#
# Run:
#   ansible-playbook playbooks/dns/test_errors.yml \
#     -e opn_host=10.6.239.114 -e opn_key=<key> -e opn_secret=<secret> -v

- name: "DNS (Unbound) error handling + input validation"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    opn_port: 443
    opn_verify_ssl: false

  tasks:
    # ── 1. Transport: 401 Unauthorized ──────────────────────────────────
    - name: "1. Error — 401 bad credentials on host_override"
      by_systems.opnsense.opnsense_ub_host_override:
        host: "{{ opn_host }}"
        key: "BADKEY000000000000000"
        secret: "BADSECRET0000000000000000000000000000000"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        hostname: "inttest-err"
        domain: "lab.test"
        server: "10.11.2.99"
        state: present
      register: r
      failed_when: false

    - name: "1. Assert 401 caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)authentication.*(failed|401)')
        fail_msg: "Expected 401 auth error, got: {{ r.msg | default('no msg') }}"

    # ── 2. Transport: timeout ───────────────────────────────────────────
    - name: "2. Error — timeout on forward (192.0.2.1)"
      by_systems.opnsense.opnsense_ub_forward:
        host: "192.0.2.1"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        domain: "inttest-err.lab.test"
        server: "10.11.2.99"
        state: present
      register: r
      failed_when: false

    - name: "2. Assert timeout caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(timed.out|connection.failed)')
        fail_msg: "Expected timeout, got: {{ r.msg | default('no msg') }}"

    # ── 3. Validation: empty hostname (required) ────────────────────────
    - name: "3. Error — empty hostname on host_override"
      by_systems.opnsense.opnsense_ub_host_override:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        hostname: ""
        domain: "lab.test"
        server: "10.11.2.99"
        state: present
      register: r
      failed_when: false

    - name: "3. Assert FieldValidationError on empty hostname"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|hostname)')
        fail_msg: "Expected validation error on empty hostname, got: {{ r.msg | default('no msg') }}"

    # ── 4. Validation: bad ACL action enum ──────────────────────────────
    - name: "4. Error — bad ACL action enum INVALID"
      by_systems.opnsense.opnsense_ub_acl:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "inttest-err-acl"
        action: "INVALID"
        state: present
      register: r
      failed_when: false

    - name: "4. Assert bad action enum caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|action|must be)')
        fail_msg: "Expected validation error on bad action, got: {{ r.msg | default('no msg') }}"

    # ── 5. Validation: bad host_override rr enum ────────────────────────
    - name: "5. Error — bad host_override rr enum INVALID"
      by_systems.opnsense.opnsense_ub_host_override:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        hostname: "inttest-err"
        domain: "lab.test"
        server: "10.11.2.99"
        rr: "INVALID"
        state: present
      register: r
      failed_when: false

    - name: "5. Assert bad rr enum caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|rr|must be)')
        fail_msg: "Expected validation error on bad rr, got: {{ r.msg | default('no msg') }}"

    # ── 6. Validation: empty DoT server (required) ──────────────────────
    - name: "6. Error — empty DoT server"
      by_systems.opnsense.opnsense_ub_dot:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        server: ""
        state: present
      register: r
      failed_when: false

    - name: "6. Assert FieldValidationError on empty server"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|server)')
        fail_msg: "Expected validation error on empty server, got: {{ r.msg | default('no msg') }}"

    # ── Result ──────────────────────────────────────────────────────────
    - name: "PASS"
      ansible.builtin.debug:
        msg: "PASS — DNS error handling: 401, timeout, empty hostname, bad action enum, bad rr enum, empty DoT server all caught."
