---
# E2E test playbook — firewall aliases, filter rules, D-NAT, source NAT.
#
# Creates test objects with real network values, verifies idempotency,
# then cleans up. All test objects use inttest- prefix.
# D-NAT rules are created DISABLED to avoid disrupting the live gateway.
#
# Usage:
#   ansible-playbook playbooks/playbook_fw_e2e.yml -e @vars.yml -v
#
# Required vars (vars.yml or extra-vars):
#   opn_host, opn_port, opn_key, opn_secret, opn_verify_ssl

- name: "OPNsense Firewall E2E Test"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    test_alias_name: "inttest_fw_svc_host"
    test_filter_desc: "inttest-fw-pass-svc-ntp"
    test_dnat_desc: "inttest-fw-dnat-svc-http"
    test_snat_desc: "inttest-fw-snat-svc"

  tasks:
    # ----------------------------------------------------------------
    # Phase 1: Alias CRUD (safe — aliases don't affect traffic)
    # ----------------------------------------------------------------
    - name: "1.1 Create host alias in SVC zone"
      by_systems.opnsense.opnsense_fw_alias:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_alias_name }}"
        type: host
        content: "10.1.3.99"
        description: "E2E test host in SVC VLAN 330"
        state: present
      register: alias_create

    - name: "1.2 Verify alias created"
      ansible.builtin.assert:
        that:
          - alias_create.changed
          - alias_create.action in ['created', 'updated']

    - name: "1.3 Alias idempotency check"
      by_systems.opnsense.opnsense_fw_alias:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_alias_name }}"
        type: host
        content: "10.1.3.99"
        description: "E2E test host in SVC VLAN 330"
        state: present
      register: alias_noop

    - name: "1.4 Verify alias noop"
      ansible.builtin.assert:
        that:
          - not alias_noop.changed
          - alias_noop.action == 'noop'

    # ----------------------------------------------------------------
    # Phase 2: Filter rule CRUD (safe — real SVC NTP rule)
    # ----------------------------------------------------------------
    - name: "2.1 Create filter rule — SVC NTP outbound"
      by_systems.opnsense.opnsense_fw_filter:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: "{{ test_filter_desc }}"
        action: pass
        interface: wan
        direction: in
        ipprotocol: inet
        protocol: UDP
        source_net: net_svc
        destination_port: "123"
        state: present
      register: filter_create

    - name: "2.2 Verify filter rule created"
      ansible.builtin.assert:
        that:
          - filter_create.changed
          - filter_create.action in ['created', 'updated']

    - name: "2.3 Filter idempotency check"
      by_systems.opnsense.opnsense_fw_filter:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: "{{ test_filter_desc }}"
        action: pass
        interface: wan
        direction: in
        ipprotocol: inet
        protocol: UDP
        source_net: net_svc
        destination_port: "123"
        state: present
      register: filter_noop

    - name: "2.4 Verify filter noop"
      ansible.builtin.assert:
        that:
          - not filter_noop.changed

    # ----------------------------------------------------------------
    # Phase 3: D-NAT rule CRUD (DISABLED — safe on live gateway)
    # ----------------------------------------------------------------
    - name: "3.1 Create D-NAT rule — SVC HTTP (disabled)"
      by_systems.opnsense.opnsense_fw_dnat:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        descr: "{{ test_dnat_desc }}"
        interface: wan
        ipprotocol: inet
        protocol: tcp
        target: "10.1.3.10"
        local_port: "8080"
        disabled: true
        state: present
      register: dnat_create

    - name: "3.2 Verify D-NAT created"
      ansible.builtin.assert:
        that:
          - dnat_create.changed
          - dnat_create.action in ['created', 'updated']

    - name: "3.3 D-NAT idempotency check"
      by_systems.opnsense.opnsense_fw_dnat:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        descr: "{{ test_dnat_desc }}"
        interface: wan
        ipprotocol: inet
        protocol: tcp
        target: "10.1.3.10"
        local_port: "8080"
        disabled: true
        state: present
      register: dnat_noop

    - name: "3.4 Verify D-NAT noop"
      ansible.builtin.assert:
        that:
          - not dnat_noop.changed

    # ----------------------------------------------------------------
    # Phase 4: Source NAT rule CRUD (safe — masquerade)
    # ----------------------------------------------------------------
    - name: "4.1 Create source NAT rule — SVC masquerade"
      by_systems.opnsense.opnsense_fw_source_nat:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: "{{ test_snat_desc }}"
        interface: wan
        ipprotocol: inet
        source_net: net_svc
        target: wanip
        state: present
      register: snat_create

    - name: "4.2 Verify source NAT created"
      ansible.builtin.assert:
        that:
          - snat_create.changed
          - snat_create.action in ['created', 'updated']

    # ----------------------------------------------------------------
    # Phase 5: Check mode (dry run)
    # ----------------------------------------------------------------
    - name: "5.1 Check mode — alias delete"
      by_systems.opnsense.opnsense_fw_alias:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_alias_name }}"
        state: absent
      check_mode: true
      register: check_alias

    - name: "5.2 Verify check mode reports changed but no actual delete"
      ansible.builtin.assert:
        that:
          - check_alias.changed
          - check_alias.action == 'deleted'

    # ----------------------------------------------------------------
    # Phase 6: Error handling — verify typed exceptions reach Ansible
    # ----------------------------------------------------------------
    - name: "6.1 Error: bad credentials → auth failure"
      by_systems.opnsense.opnsense_fw_alias:
        host: "{{ opn_host }}"
        key: "bad_key_for_test"
        secret: "bad_secret_for_test"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "should_not_exist"
        state: present
      register: auth_error
      ignore_errors: true

    - name: "6.2 Verify auth error caught"
      ansible.builtin.assert:
        that:
          - auth_error.failed
          - "'Authentication failed' in auth_error.msg or '401' in (auth_error.msg | default(''))"
        fail_msg: "Auth error not properly reported: {{ auth_error.msg | default('no msg') }}"

    - name: "6.3 Error: empty alias name → validation failure"
      by_systems.opnsense.opnsense_fw_alias:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: ""
        type: host
        state: present
      register: validation_error
      ignore_errors: true

    - name: "6.4 Verify validation error caught"
      ansible.builtin.assert:
        that:
          - validation_error.failed
        fail_msg: "Validation error not properly reported"

    - name: "6.5 Error: unreachable host → connection failure"
      by_systems.opnsense.opnsense_fw_filter:
        host: "10.99.99.99"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: 443
        verify_ssl: false
        description: "should_not_exist"
        state: present
      register: conn_error
      ignore_errors: true

    - name: "6.6 Verify connection error caught"
      ansible.builtin.assert:
        that:
          - conn_error.failed
          - "'timed out' in conn_error.msg or 'Connection failed' in conn_error.msg"
        fail_msg: "Connection error not properly reported: {{ conn_error.msg | default('no msg') }}"

    # ----------------------------------------------------------------
    # Phase 7: Cleanup — delete all test objects (reverse order)
    # ----------------------------------------------------------------
    - name: "7.1 Delete source NAT rule"
      by_systems.opnsense.opnsense_fw_source_nat:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: "{{ test_snat_desc }}"
        state: absent
      register: snat_del

    - name: "7.2 Delete D-NAT rule"
      by_systems.opnsense.opnsense_fw_dnat:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        descr: "{{ test_dnat_desc }}"
        target: "10.1.3.10"
        state: absent
      register: dnat_del

    - name: "7.3 Delete filter rule"
      by_systems.opnsense.opnsense_fw_filter:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: "{{ test_filter_desc }}"
        state: absent
      register: filter_del

    - name: "7.4 Delete alias"
      by_systems.opnsense.opnsense_fw_alias:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "{{ test_alias_name }}"
        state: absent
      register: alias_del

    - name: "7.5 Verify all test objects deleted"
      ansible.builtin.assert:
        that:
          - snat_del.changed
          - dnat_del.changed
          - filter_del.changed
          - alias_del.changed
        fail_msg: "Cleanup incomplete — check OPNsense for leftover inttest- objects"

    - name: "E2E PASS — all firewall tests completed"
      ansible.builtin.debug:
        msg: >-
          Firewall E2E test complete:
          alias={{ alias_create.action }},
          filter={{ filter_create.action }},
          dnat={{ dnat_create.action }} (disabled),
          snat={{ snat_create.action }},
          idempotency verified, cleanup done.
