---
# test_errors.yml — Services error handling + input validation
#
# What it tests (matching pylib 10-step error coverage):
#   1. 401 — bad credentials → "Authentication failed"
#   2. Timeout — unreachable host 192.0.2.1 → "timed out" or "Connection failed"
#   3. Missing required — empty cp_zone description → caught by pylib FieldValidationError
#   4. Missing required — empty cron_job description → caught by pylib FieldValidationError
#   5. Missing required — empty ddns_account description → caught by pylib FieldValidationError
#   6. Bad enum — invalid syslog transport → caught by Ansible argument_spec (choices)
#   7. Missing required — empty syslog hostname → caught by pylib FieldValidationError
#
# Static enums (choices in module — Ansible validates before pylib):
#   - transport: udp4, tcp4, udp6, tcp6
#   - state: present, absent
#
# Dynamic fields (type: str — no Ansible choices, pylib or API validates):
#   - interfaces, authservers, certificate
#
# Regex used in asserts for robust error matching across versions.
#
# Verbosity:
#   -v    → INFO logging in tests/integration/logs/ansible-{date}.log
#   -vv   → DEBUG logging (all HTTP calls + manager actions)
#
# Run:
#   ansible-playbook playbooks/services/test_errors.yml \
#     -e opn_host=10.6.239.114 -e opn_key=<key> -e opn_secret=<secret> -v

- name: "Services error handling + input validation"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    opn_port: 443
    opn_verify_ssl: false

  tasks:
    # ── 1. Transport: 401 Unauthorized ──────────────────────────────────
    - name: "1. Error — 401 bad credentials on cron_job"
      by_systems.opnsense.opnsense_cron_job:
        host: "{{ opn_host }}"
        key: "BADKEY000000000000000"
        secret: "BADSECRET0000000000000000000000000000000"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: "inttest-err-cron"
        command: "configctl firmware changelog fetch"
        state: present
      register: r
      failed_when: false

    - name: "1. Assert 401 caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)authentication.*(failed|401)')
        fail_msg: "Expected 401 auth error, got: {{ r.msg | default('no msg') }}"

    # ── 2. Transport: timeout ───────────────────────────────────────────
    - name: "2. Error — timeout on syslog_dest (192.0.2.1)"
      by_systems.opnsense.opnsense_syslog_dest:
        host: "192.0.2.1"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: "inttest-err-syslog"
        hostname: "10.6.225.99"
        state: present
      register: r
      failed_when: false

    - name: "2. Assert timeout caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(timed.out|connection.failed)')
        fail_msg: "Expected timeout, got: {{ r.msg | default('no msg') }}"

    # ── 3. Validation: empty cp_zone description (required) ─────────────
    - name: "3. Error — empty cp_zone description"
      by_systems.opnsense.opnsense_cp_zone:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: ""
        state: present
      register: r
      failed_when: false

    - name: "3. Assert FieldValidationError on empty cp_zone description"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|description)')
        fail_msg: "Expected validation error on empty description, got: {{ r.msg | default('no msg') }}"

    # ── 4. Validation: empty cron_job description (required) ────────────
    - name: "4. Error — empty cron_job description"
      by_systems.opnsense.opnsense_cron_job:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: ""
        state: present
      register: r
      failed_when: false

    - name: "4. Assert FieldValidationError on empty cron_job description"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|description)')
        fail_msg: "Expected validation error on empty description, got: {{ r.msg | default('no msg') }}"

    # ── 5. Validation: empty ddns_account description (required) ────────
    - name: "5. Error — empty ddns_account description"
      by_systems.opnsense.opnsense_ddns_account:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: ""
        hostnames: "inttest-err.example.com"
        checkip: "web_dyndns"
        state: present
      register: r
      failed_when: false

    - name: "5. Assert FieldValidationError on empty ddns_account description"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|description)')
        fail_msg: "Expected validation error on empty description, got: {{ r.msg | default('no msg') }}"

    # ── 6. Validation: bad syslog transport enum ────────────────────────
    - name: "6. Error — bad syslog transport enum INVALID"
      by_systems.opnsense.opnsense_syslog_dest:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: "inttest-err-syslog"
        transport: "INVALID"
        hostname: "10.6.225.99"
        state: present
      register: r
      failed_when: false

    - name: "6. Assert bad transport enum caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|transport|must be)')
        fail_msg: "Expected validation error on bad transport, got: {{ r.msg | default('no msg') }}"

    # ── 7. Validation: empty syslog hostname (required) ─────────────────
    - name: "7. Error — empty syslog hostname"
      by_systems.opnsense.opnsense_syslog_dest:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: "inttest-err-syslog"
        hostname: ""
        state: present
      register: r
      failed_when: false

    - name: "7. Assert FieldValidationError on empty hostname"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|hostname)')
        fail_msg: "Expected validation error on empty hostname, got: {{ r.msg | default('no msg') }}"

    # ── Result ──────────────────────────────────────────────────────────
    - name: "PASS"
      ansible.builtin.debug:
        msg: "PASS — Services error handling: 401, timeout, empty cp_zone/cron/ddns descriptions, bad transport enum, empty syslog hostname all caught."
