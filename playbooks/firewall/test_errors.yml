---
# test_errors.yml — Firewall domain error handling + input validation
#
# What it tests (matching pylib 10-step error coverage):
#   1. 401 — bad credentials on alias → "Authentication failed"
#   2. Timeout — unreachable host 192.0.2.1 on filter → "timed out" or "Connection failed"
#   3. Empty alias name (required str) → FieldValidationError
#   4. Bad filter action enum "INVALID" → Ansible argument_spec choices rejection
#   5. Bad filter direction enum "INVALID" → Ansible argument_spec choices rejection
#   6. Empty filter description (required) → FieldValidationError
#   7. Bad category color "ZZZZZZ" → FieldValidationError on hex color
#   8. Empty DNAT descr (required, with disabled=true) → FieldValidationError
#
# Static enums (choices in module — Ansible validates before pylib):
#   - action: pass, block, reject
#   - direction: in, out, any
#   - ipprotocol: inet, inet6, inet46
#   - state: present, absent
#
# Dynamic fields (type: str — no Ansible choices, pylib or API validates):
#   - interface, gateway, categories
#
# Regex used in asserts for robust error matching across versions.
#
# Verbosity:
#   -v    → INFO logging in tests/integration/logs/ansible-{date}.log
#   -vv   → DEBUG logging (all HTTP calls + manager actions)
#
# Run:
#   ansible-playbook playbooks/firewall/test_errors.yml \
#     -e opn_host=10.6.239.114 -e opn_key=<key> -e opn_secret=<secret> -v

- name: "Firewall error handling + input validation"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    opn_port: 443
    opn_verify_ssl: false

  tasks:
    # ── 1. Transport: 401 Unauthorized ──────────────────────────────────
    - name: "1. Error — 401 bad credentials on alias"
      by_systems.opnsense.opnsense_fw_alias:
        host: "{{ opn_host }}"
        key: "BADKEY000000000000000"
        secret: "BADSECRET0000000000000000000000000000000"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "e2e_should_not_exist"
        state: present
      register: r
      failed_when: false

    - name: "1. Assert 401 caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)authentication.*(failed|401)')
        fail_msg: "Expected 401 auth error, got: {{ r.msg | default('no msg') }}"

    # ── 2. Transport: timeout ───────────────────────────────────────────
    - name: "2. Error — timeout on unreachable 192.0.2.1 (filter)"
      by_systems.opnsense.opnsense_fw_filter:
        host: "192.0.2.1"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: "e2e-timeout"
        state: present
      register: r
      failed_when: false

    - name: "2. Assert timeout caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(timed.out|connection.failed)')
        fail_msg: "Expected timeout, got: {{ r.msg | default('no msg') }}"

    # ── 3. Validation: empty alias name (required str) ──────────────────
    - name: "3. Error — empty alias name"
      by_systems.opnsense.opnsense_fw_alias:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: ""
        state: present
      register: r
      failed_when: false

    - name: "3. Assert empty name caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|name)')
        fail_msg: "Expected validation error on empty name, got: {{ r.msg | default('no msg') }}"

    # ── 4. Validation: bad filter action enum ───────────────────────────
    - name: "4. Error — bad filter action enum INVALID"
      by_systems.opnsense.opnsense_fw_filter:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: "e2e-bad-action"
        action: "INVALID"
        state: present
      register: r
      failed_when: false

    - name: "4. Assert bad action caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|must be one of|action)')
        fail_msg: "Expected action validation error, got: {{ r.msg | default('no msg') }}"

    # ── 5. Validation: bad filter direction enum ────────────────────────
    - name: "5. Error — bad filter direction enum INVALID"
      by_systems.opnsense.opnsense_fw_filter:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: "e2e-bad-direction"
        direction: "INVALID"
        state: present
      register: r
      failed_when: false

    - name: "5. Assert bad direction caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|must be one of|direction)')
        fail_msg: "Expected direction validation error, got: {{ r.msg | default('no msg') }}"

    # ── 6. Validation: empty filter description (required) ──────────────
    - name: "6. Error — empty filter description"
      by_systems.opnsense.opnsense_fw_filter:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        description: ""
        state: present
      register: r
      failed_when: false

    - name: "6. Assert empty description caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|description)')
        fail_msg: "Expected validation error on empty description, got: {{ r.msg | default('no msg') }}"

    # ── 7. Validation: bad category color ───────────────────────────────
    - name: "7. Error — bad category color ZZZZZZ"
      by_systems.opnsense.opnsense_fw_category:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        name: "e2e-bad-color"
        color: "ZZZZZZ"
        state: present
      register: r
      failed_when: false

    - name: "7. Assert bad color caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|color|hex)')
        fail_msg: "Expected color validation error, got: {{ r.msg | default('no msg') }}"

    # ── 8. Validation: empty DNAT descr (required, disabled=true) ───────
    - name: "8. Error — empty DNAT descr with disabled=true"
      by_systems.opnsense.opnsense_fw_dnat:
        host: "{{ opn_host }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        port: "{{ opn_port }}"
        verify_ssl: "{{ opn_verify_ssl }}"
        descr: ""
        target: "10.0.0.1"
        disabled: true
        state: present
      register: r
      failed_when: false

    - name: "8. Assert empty DNAT descr caught with regex"
      ansible.builtin.assert:
        that:
          - r.msg is defined
          - r.msg is regex('(?i)(validation|required|descr)')
        fail_msg: "Expected validation error on empty descr, got: {{ r.msg | default('no msg') }}"

    # ── Result ──────────────────────────────────────────────────────────
    - name: "PASS"
      ansible.builtin.debug:
        msg: "PASS — Firewall error handling: 401, timeout, empty name, bad action, bad direction, empty descr, bad color, empty DNAT descr all caught."
